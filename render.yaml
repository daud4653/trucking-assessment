# Render Blueprint: one Docker web service plus managed PostgreSQL.
services:
  - type: web
    name: weather-aware-truck-routing
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/ready/
    preDeployCommand: python manage.py migrate --noinput && python manage.py createcachetable
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: truck-routing-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: weather-aware-truck-routing.onrender.com
      - key: NUM_PROXIES
        value: "1"
      - key: PROVIDER_USER_AGENT
        sync: false
databases:
  - name: truck-routing-db
    plan: basic-256mb
